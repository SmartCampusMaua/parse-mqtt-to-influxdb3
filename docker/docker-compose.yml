name: parse-mqtt-to-influxdb3

services:
  mqtt-to-influxdb3:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    env_file: ../.env
    environment:
      # Overrides .env's localhost:8181 (only valid for `go run` on the host) —
      # inside this container, the shared zc2x influxdb3-core is reached by
      # its container name on the docker_default network.
      INFLUXDB_HOST: http://influxdb3-core:8181
    networks:
      - zc2x
    volumes:
      - ../devices.json:/etc/mqtt-to-influxdb3/devices.json:ro
      - ../assets.json:/etc/mqtt-to-influxdb3/assets.json:ro
      - ../sensors.json:/etc/mqtt-to-influxdb3/sensors.json:ro
      - ../device_channels.json:/etc/mqtt-to-influxdb3/device_channels.json:ro

networks:
  zc2x:
    name: docker_default
    external: true
